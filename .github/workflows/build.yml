name: Build ProUnlock dylib
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 dylib with Xcode clang
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -mios-version-min=12.0 \
            -dynamiclib -framework Foundation -fobjc-arc -O2 \
            -o ProUnlock.dylib ProUnlock.m
          file ProUnlock.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: ProUnlock-dylib
          path: ProUnlock.dylib
